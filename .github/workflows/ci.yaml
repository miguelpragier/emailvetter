name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag whose assets should be completed (for example v1.0.0)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Format, vet, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rqlite:
        image: rqlite/rqlite:10.6.4
        ports:
          - 4001:4001
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o bin/emailvetter ./cmd/emailvetter
      - name: Unit tests with race detector
        run: go test -race -count=1 -timeout=5m ./...
      - name: Wait for database readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4001/readyz; then
              exit 0
            fi
            sleep 1
          done
          echo 'rqlite did not become ready' >&2
          exit 1
      - name: Integration tests with race detector
        env:
          EMAILVETTER_RQLITE_ADDR: http://127.0.0.1:4001
        run: go test -race -count=1 -timeout=5m -run Integration ./internal/...

  secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  package:
    name: Check release archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: 'v2.20.0'
          install-only: true
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Build archives without publishing
        run: goreleaser release --snapshot --clean --skip=publish

  release:
    name: Publish semantic release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    needs: [test, secrets, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Calculate semantic release
        if: github.event_name == 'push'
        id: semantic
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ github.token }}
          dry: true
          changelog-file: ${{ runner.temp }}/emailvetter-release-notes.md
      - name: Select release tag
        id: target
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          NEW_VERSION: ${{ steps.semantic.outputs.version }}
        run: |
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ] && [ -n "$NEW_VERSION" ]; then
            tag="v$NEW_VERSION"
          fi
          if [ -z "$tag" ]; then
            echo 'No release to package'
            exit 0
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as v1.0.0' >&2
            exit 1
          fi
          if [ -n "$REQUESTED_TAG" ]; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            git checkout --detach "$tag"
          else
            git tag "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install GoReleaser for publishing
        if: steps.target.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v7
        with:
          version: 'v2.20.0'
          install-only: true
      - name: Publish release archives
        if: steps.target.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ runner.temp }}/emailvetter-release-notes.md
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            goreleaser release --clean
          else
            goreleaser release --clean --release-notes "$RELEASE_NOTES"
          fi
